<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src https://tile.openstreetmap.org data:; connect-src 'none'">
<link rel="stylesheet" href="leaflet.css"><style>
html,body,#map{height:100%;width:100%;margin:0;background:#14171c;font-family:-apple-system,sans-serif;color-scheme:dark}
/* Filter only the base tiles: labels stay legible and route layers retain blue. */
.leaflet-tile-pane{filter:grayscale(.75) invert(1) hue-rotate(180deg) saturate(.6) brightness(.76) contrast(.9)}
.leaflet-control-zoom{border:1px solid #ffffff12!important;box-shadow:0 6px 24px #0006!important;border-radius:11px!important;overflow:hidden;margin-bottom:38px!important}
.leaflet-control-zoom a{color:#dce9ff!important;background:#20242b!important;border-bottom-color:#ffffff10!important}
.leaflet-control-zoom a:hover{background:#303641!important;color:#fff!important}
.leaflet-control-zoom a:focus-visible{outline:2px solid #419dff;outline-offset:-3px}
.leaflet-control-zoom a.leaflet-disabled{color:#64717f!important;background:#191d23!important}
.leaflet-control-attribution{font-size:10px!important;color:#a7b0bc!important;background:#171b20ed!important;padding:3px 8px!important;border-top-left-radius:7px}
.leaflet-control-attribution a{color:#aec8ed!important}.leaflet-control-attribution a:hover{color:#fff!important}
.point{width:20px;height:20px;border:4px solid #f1f6ff;background:#0a84ff;border-radius:50%;box-shadow:0 0 0 1px #0a84ff66,0 3px 16px #0008}
.route-endpoint{display:grid;place-items:center;box-sizing:border-box;width:30px;height:30px;border:3px solid #eef5ff;background:#0a84ff;border-radius:50%;color:white;font-size:13px;font-weight:750;box-shadow:0 2px 14px #0009}
.route-endpoint.end{background:#7366ee}
.traveler{position:relative;box-sizing:border-box;width:20px;height:20px;border:4px solid #0a84ff;background:#f2f7ff;border-radius:50%;box-shadow:0 0 0 2px #111821,0 2px 12px #0008}
.traveler::before{content:'';position:absolute;inset:-9px;border:2px solid #419dff99;border-radius:50%;animation:traveler-pulse 2s ease-out infinite}
@keyframes traveler-pulse{0%{transform:scale(.65);opacity:.8}100%{transform:scale(1.3);opacity:0}}
@media(prefers-reduced-motion:reduce){.traveler::before{animation:none;opacity:.4}}
#notice,#preview{position:absolute;left:20px;z-index:500;background:#20252ef2;color:#dce5f2;border:1px solid #ffffff12;box-shadow:0 6px 24px #0004;border-radius:11px;font-size:12px;line-height:1.5;display:none}
#notice{bottom:70px;right:65px;padding:12px}
#preview{bottom:35px;right:65px;padding:10px}
</style></head><body><div id="map" aria-label="Carte OpenStreetMap"></div><div id="notice">Le fond de carte est indisponible. Vérifiez Internet ou saisissez les coordonnées à gauche.</div>
<script src="leaflet.js"></script><script>
// Native background windows can pause animation frames. Avoid fading tile
// images from opacity zero: a background preview must still show loaded tiles.
const map = L.map('map',{zoomControl:false,worldCopyJump:true,minZoom:2,maxZoom:19,
  fadeAnimation:false,zoomAnimation:false,markerZoomAnimation:false}).setView([48.8566,2.3522],12);
L.control.zoom({position:'bottomright'}).addTo(map);
const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  keepBuffer:1,updateWhenIdle:true
}).addTo(map);
let loadedTiles=0;
const notice=document.getElementById('notice');
tiles.on('tileerror',()=>notice.style.display='block');
tiles.on('tileload',()=>{loadedTiles++;notice.style.display='none';});
setTimeout(()=>{if(!loadedTiles)notice.style.display='block';},12000);
let pin=null;
window.repereSet=(lat,lon,center)=>{
  if(lat===null){if(pin){pin.remove();pin=null;}return;}
  if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)return;
  if(pin)pin.setLatLng([lat,lon]);else pin=L.marker([lat,lon],{icon:L.divIcon({className:'',html:'<div class="point"></div>',iconSize:[28,28],iconAnchor:[14,14]})}).addTo(map);
  if(center)map.setView([lat,lon],15,{animate:false});
};
// Route data comes from the native app. Keep all geometry local to this view.
// Reject a malformed route as a whole, rather than joining across a bad point.
function validRoutePoint(point){
  return Array.isArray(point)&&point.length===2&&
    Number.isFinite(point[0])&&Number.isFinite(point[1])&&
    Math.abs(point[0])<=90&&Math.abs(point[1])<=180;
}
window.repereCenter=(lat,lon)=>{
  if(validRoutePoint([lat,lon]))map.setView([lat,lon],15,{animate:false});
};
let randomArea=null,randomAreaCenter=null;
window.repereSetRandomArea=(center,radius,fit)=>{
  // Clear invalid or deselected areas so stale bounds never appear actionable.
  if(!validRoutePoint(center)||!Number.isFinite(radius)||radius<10||radius>10000){
    randomArea?.remove();randomArea=null;randomAreaCenter=null;return;
  }
  randomAreaCenter=[...center];
  if(randomArea){randomArea.setLatLng(center);randomArea.setRadius(radius);}
  else randomArea=L.circle(center,{radius,color:'#419dff',weight:2,dashArray:'7 5',
    fillColor:'#0a84ff',fillOpacity:.13,interactive:false}).addTo(map);
  if(fit)map.fitBounds(randomArea.getBounds(),{
    paddingTopLeft:[48,115],paddingBottomRight:[65,65],maxZoom:18,animate:false
  });
};
function samePoint(a,b){return a===b||Boolean(a&&b&&a[0]===b[0]&&a[1]===b[1]);}
const endpointIcons={
  start:L.divIcon({className:'',html:'<span class="route-endpoint" role="img" aria-label="Départ A">A</span>',iconSize:[30,30],iconAnchor:[15,15]}),
  end:L.divIcon({className:'',html:'<span class="route-endpoint end" role="img" aria-label="Arrivée B">B</span>',iconSize:[30,30],iconAnchor:[15,15]})
};
const endpointState={start:{point:null,marker:null},end:{point:null,marker:null}};
function updateEndpoint(key,point){
  if(point!==null&&!validRoutePoint(point))return;
  const state=endpointState[key];
  if(samePoint(state.point,point))return;
  if(point===null){state.marker?.remove();state.marker=null;state.point=null;return;}
  state.point=[...point];
  if(state.marker)state.marker.setLatLng(point);
  else state.marker=L.marker(point,{icon:endpointIcons[key],interactive:false,keyboard:false,zIndexOffset:200}).addTo(map);
}
window.repereRouteEndpoints=(start,end)=>{
  updateEndpoint('start',start);
  updateEndpoint('end',end);
};
let routePoints=[],routeLine=null,routeHalo=null;
window.repereRoute=(points,center)=>{
  if(!Array.isArray(points)||!points.every(validRoutePoint))return;
  const changed=points.length!==routePoints.length||points.some((point,index)=>!samePoint(point,routePoints[index]));
  if(changed){
    routePoints=points.map(point=>[...point]);
    if(points.length<2){routeLine?.remove();routeHalo?.remove();routeLine=null;routeHalo=null;}
    else if(routeLine){routeHalo.setLatLngs(points);routeLine.setLatLngs(points);}
    else{
      routeHalo=L.polyline(points,{color:'#101824',weight:8,opacity:.95,interactive:false}).addTo(map);
      routeLine=L.polyline(points,{color:'#419dff',weight:4,opacity:1,interactive:false}).addTo(map);
    }
  }
  window.repereRouteEndpoints(points[0]??null,points.length>1?points[points.length-1]:null);
  if(center&&points.length){
    // Leave room for the native search bar above the map.
    map.fitBounds(L.latLngBounds(points),{paddingTopLeft:[48,115],paddingBottomRight:[65,65],maxZoom:16,animate:false});
  }
};
let traveler=null,travelerPoint=null;
const travelerIcon=L.divIcon({className:'',html:'<span class="traveler" style="display:block" role="img" aria-label="Position simulée"></span>',iconSize:[20,20],iconAnchor:[10,10]});
window.repereTraveler=(lat,lon)=>{
  if(lat===null){traveler?.remove();traveler=null;travelerPoint=null;return;}
  const point=[lat,lon];
  if(!validRoutePoint(point)||samePoint(travelerPoint,point))return;
  travelerPoint=point;
  // Keep date-line crossings in the same world copy as the selected circle.
  const displayPoint=randomAreaCenter
    ? [lat,randomAreaCenter[1]+((lon-randomAreaCenter[1]+540)%360-180)] : point;
  if(traveler)traveler.setLatLng(displayPoint);
  else traveler=L.marker(displayPoint,{icon:travelerIcon,interactive:false,keyboard:false,zIndexOffset:500}).addTo(map);
};
function notifyNative(message){
  const bridge=window.webkit?.messageHandlers?.repere;
  if(bridge){bridge.postMessage(message);return;}
  if(message.kind==='point'){
    window.repereSet(message.lat,message.lon,false);
    const preview=document.getElementById('preview');
    preview.style.display='block';
    preview.textContent=`Aperçu uniquement · ${message.lat.toFixed(6)}, ${message.lon.toFixed(6)} · Ouvre Repère pour connecter l’iPhone.`;
  }
}
const preview=document.createElement('div');preview.id='preview';document.body.append(preview);
map.on('click',e=>notifyNative({kind:'point',lat:e.latlng.lat,lon:e.latlng.wrap().lng}));
new ResizeObserver(()=>map.invalidateSize()).observe(document.getElementById('map'));
notifyNative({kind:'ready'});
</script></body></html>
