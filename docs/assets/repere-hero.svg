<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Repère — choisissez votre prochain point</title>
  <desc id="desc">Illustration des trois modes : position fixe, trajet et déplacement aléatoire dans un cercle. Les lignes bleues représentent un exemple de déplacement dans la zone choisie.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1c2637"/><stop offset="1" stop-color="#0d1118"/></linearGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#439aff"/><stop offset="1" stop-color="#3152da"/></linearGradient>
    <radialGradient id="zone"><stop stop-color="#368bff" stop-opacity=".2"/><stop offset="1" stop-color="#368bff" stop-opacity=".035"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#c6d8ff" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <rect x="640" width="640" height="640" fill="url(#grid)"/>
  <rect x="72" y="68" width="72" height="72" rx="21" fill="url(#blue)"/>
  <path d="M108 83 89 124q-3 7 4 4l15-8 15 8q7 3 4-4z" fill="white"/>
  <text x="163" y="119" fill="#f4f7ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="44" font-weight="700">Repère</text>
  <rect x="323" y="90" width="65" height="31" rx="15" fill="#287aff" fill-opacity=".16"/>
  <text x="355" y="111" text-anchor="middle" fill="#79b2ff" font-family="monospace" font-size="16">v1.4</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="72" y="243" fill="#f4f7ff" font-size="49" font-weight="700">Choisissez votre</text>
    <text x="72" y="306" fill="#f4f7ff" font-size="49" font-weight="700">prochain point.</text>
    <text x="74" y="362" fill="#a7b4c8" font-size="22">Simulation de localisation iPhone depuis macOS.</text>
    <g font-size="17">
      <rect x="72" y="414" width="141" height="45" rx="12" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".09"/>
      <text x="142" y="443" text-anchor="middle" fill="#c5d0e1">Position fixe</text>
      <rect x="225" y="414" width="143" height="45" rx="12" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".09"/>
      <text x="296" y="443" text-anchor="middle" fill="#c5d0e1">Trajet A → B</text>
      <rect x="380" y="414" width="135" height="45" rx="12" fill="#267bff" fill-opacity=".22" stroke="#5c9bff" stroke-opacity=".6"/>
      <text x="447" y="443" text-anchor="middle" fill="#a7caff">Aléatoire</text>
    </g>
    <text x="74" y="555" fill="#748399" font-size="16">SwiftUI · USB / Wi-Fi · Open source</text>
  </g>
  <circle cx="963" cy="307" r="212" fill="url(#zone)" stroke="#4c93ff" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="963" cy="307" r="137" fill="none" stroke="#547299" stroke-opacity=".22"/>
  <path d="m963 307-120 96 41-231 205 200-245-76 173-138 64 230-174-17 124-97" fill="none" stroke="#68a8ff" stroke-opacity=".85" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M963 307h212" stroke="#839ab8" stroke-dasharray="4 6" stroke-opacity=".55"/>
  <circle cx="963" cy="307" r="7" fill="#1c2637" stroke="#a7caff" stroke-width="3"/>
  <circle cx="1031" cy="274" r="22" fill="#5ba3ff" fill-opacity=".13"/>
  <circle cx="1031" cy="274" r="11" fill="#eef6ff" stroke="#419dff" stroke-width="4"/>
  <rect x="883" y="537" width="161" height="39" rx="19" fill="#203450" stroke="#3a5d87"/>
  <text x="963" y="562" text-anchor="middle" fill="#94b9ed" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Un rayon. Une zone.</text>
</svg>
